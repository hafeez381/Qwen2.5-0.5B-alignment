model: Qwen/Qwen2.5-0.5B
seed: 42
max_length: 512
per_device_batch: 2
grad_accum: 16
lr: 2.0e-5
warmup_ratio: 0.03
weight_decay: 0.1
grad_clip: 1.0
epochs: 1
eval_every: 100
eval_batch: 8
snapshot_every: 235
train: data/prepared/sft_train.jsonl
val: data/prepared/sft_val.jsonl
output: outputs/sft
results: results/sft
