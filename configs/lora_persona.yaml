model: HuggingFaceTB/SmolLM2-360M-Instruct
data: data/persona_lora/ramsay_style_preferences.json
seed: 42
holdout: 20
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: all-linear
beta: 0.1
lr: 5.0e-5
lr_scheduler: cosine
warmup_ratio: 0.1
per_device_batch: 4
grad_accum: 2
epochs: 3
max_length: 512
max_prompt_length: 256
output: outputs/persona
results: results/persona
